<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라푼젤: 사이버 하이스트 (Rapunzel: Cyber Heist)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&family=VT323&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 글로벌 테마 변수 설정 (제시된 색상 팔레트 반영) */
        :root {
            --bg-deep: #0d0d0d;        /* 심해의 검정 */
            --bg-machinery: #1a1a1a;   /* 기계적 회색 */
            --neon-gold: #ffd700;      /* 황금빛 나노 케이블 */
            --neon-cyan: #00f3ff;      /* 사이버 시안 */
            --neon-red: #ff003c;       /* 시스템 경고 레드 */
            --text-main: #e0e0e0;      /* 주 텍스트 */
            --cold-grey: #4a4a4a;      /* 차가운 회색 */
            --hud-bg: rgba(13, 13, 13, 0.95);
            
            --font-pixel: 'VT323', monospace;
            --font-main: 'Noto Sans KR', sans-serif;
            --font-title: 'Orbitron', sans-serif;
        }

        /* 기본 레이아웃 및 텍스처 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* CRT 모니터 및 스캔라인 화면 왜곡 연출 */
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
            z-index: 9999; background-size: 100% 3px, 6px 100%; pointer-events: none;
        }

        /* 상단 고정 HUD 레이아웃 */
        #header-fixed {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background-color: var(--hud-bg); 
            border-bottom: 2px solid var(--cold-grey);
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }

        #game-title-fixed {
            text-align: center; padding: 12px 0; font-family: var(--font-title);
            color: var(--neon-cyan); font-size: 1.3rem; letter-spacing: 5px;
            text-shadow: 0 0 10px var(--neon-cyan); border-bottom: 1px solid #222;
        }

        #hud {
            height: 65px; display: flex; justify-content: space-around; align-items: center;
            font-family: var(--font-pixel); font-size: 1.6rem; padding: 0 20px;
        }
        .stat-box { display: flex; align-items: center; gap: 10px; width: 30%; }
        .stat-label { font-weight: bold; }
        #label-sync { color: var(--neon-gold); text-shadow: 0 0 5px var(--neon-gold); }
        #label-integ { color: var(--neon-cyan); text-shadow: 0 0 5px var(--neon-cyan); }
        #label-public { color: #ffffff; text-shadow: 0 0 5px #ffffff; }
        
        .progress-bar { flex-grow: 1; height: 14px; background-color: #111; border: 1px solid var(--cold-grey); position: relative; }
        .progress-fill { height: 100%; width: 0%; transition: width 0.4s ease-out; }
        #bar-sync { background-color: var(--neon-gold); box-shadow: 0 0 8px var(--neon-gold); }
        #bar-integ { background-color: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }
        #bar-public { background-color: #ffffff; box-shadow: 0 0 8px #ffffff; }
        .stat-value { min-width: 50px; text-align: right; color: #fff; }

        /* 메인 콘텐츠 스테이지 구역 */
        #stage {
            margin-top: 150px; padding: 40px 20px; max-width: 1100px; margin-left: auto; margin-right: auto;
            min-height: calc(100vh - 380px); transition: opacity 0.4s ease; padding-bottom: 260px;
        }
        /* 표지 이미지 컨테이너 및 이미지 스타일 */
        .cover-image-container {
            width: 100%;
            max-width: 600px; /* 이미지의 최대 가로 두께 제한 */
            margin: 0 auto 30px auto; /* 중앙 정렬 및 아래쪽 여백 */
            border: 1px solid var(--neon-gold); /* 황금빛 테두리 */
            padding: 4px;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2); /* 은은한 황금빛 네온 효과 */
        }
        .cover-image {
            width: 100%;
            height: auto;
            display: block;
            filter: brightness(0.9) contrast(1.1); /* 미세한 분위기 보정 */
        }
        /* 표지 및 단일 레이아웃 컨테이너 */
        .cover-container { text-align: center; padding-top: 50px; width: 100%; }
        .student-info { font-size: 1.5rem; color: var(--cold-grey); margin-bottom: 20px; font-family: var(--font-pixel); letter-spacing: 3px; }
        .main-title-large { font-size: 3.5rem; color: var(--neon-gold); font-family: var(--font-title); text-shadow: 0 0 25px var(--neon-gold); margin-bottom: 25px; letter-spacing: 4px; line-height: 1.3; }
        .variable-display { font-size: 1.4rem; color: var(--neon-cyan); margin-bottom: 50px; font-family: var(--font-pixel); text-shadow: 0 0 5px var(--neon-cyan); }

        /* 씬 타이틀 */
        .scene-title { width: 100%; color: var(--neon-gold); font-size: 1.7rem; margin-bottom: 25px; font-family: var(--font-title); letter-spacing: 2px; border-bottom: 1px solid var(--bg-machinery); padding-bottom: 12px; text-shadow: 0 0 10px rgba(255,215,0,0.3); }

        /* 고정식 이미지를 위한 2분할 플렉스 그리드 */
        .split-layout {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            position: relative;
            width: 100%;
        }

        /* 좌측: 이미지 고정 영역 (스크롤 내려도 유지됨) */
        .left-visual-pane {
            flex: 1.1;
            position: sticky;
            top: 165px;
            z-index: 10;
        }

        /* 우측: 텍스트 스크롤 영역 */
        .right-text-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* 이미지 컨테이너 스타일 */
        .scene-image-container {
            width: 100%; border: 1px solid var(--cold-grey); padding: 4px;
            background: rgba(255, 255, 255, 0.03); box-shadow: 0 0 20px rgba(0, 243, 255, 0.05);
        }
        .scene-image { width: 100%; height: auto; display: block; filter: brightness(0.8) contrast(1.2); mix-blend-mode: luminous; }

        /* 지시문 스타일 */
        .direction {
            display: block; background: linear-gradient(90deg, rgba(26,26,26,0.9) 0%, rgba(13,13,13,0.4) 100%); 
            border-left: 4px solid var(--neon-cyan); padding: 25px; margin-bottom: 35px; 
            color: #b5b5b5; font-style: italic; font-size: 1.05rem; line-height: 1.8; 
            border-radius: 0 10px 10px 0; box-shadow: inset 10px 0 20px rgba(0,0,0,0.8);
            word-break: keep-all;
        }

        /* 본문 대사 */
        .scene-text { font-size: 1.2rem; margin-bottom: 40px; white-space: pre-line; color: #f0f0f0; }

        /* 화자 다이얼로그 라벨 */
        .speaker { font-weight: 700; display: block; margin-top: 25px; margin-bottom: 8px; font-family: var(--font-title); font-size: 1rem; letter-spacing: 1px; }
        .speaker-main { color: #ffffff; text-shadow: 0 0 8px rgba(255,255,255,0.6); }
        .speaker-rapunzel { color: var(--neon-gold); text-shadow: 0 0 8px rgba(255,215,0,0.6); }
        .speaker-system { color: var(--neon-red); font-family: var(--font-pixel); font-size: 1.4rem; margin-top: 30px; text-shadow: 0 0 5px var(--neon-red); }

        /* 하단 선택지 고정 패널 */
        #panel {
            position: fixed; bottom: 0; width: 100%; height: 250px; background-color: rgba(13, 13, 13, 0.98);
            border-top: 2px solid var(--cold-grey); display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 14px; padding: 25px; z-index: 1000;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.9);
        }
        .choice-btn {
            width: 100%; max-width: 750px; padding: 14px 25px; background-color: rgba(26,26,26,0.8);
            color: var(--neon-gold); border: 1px solid rgba(255, 215, 0, 0.3); font-family: var(--font-main);
            font-size: 1.05rem; font-weight: 500; cursor: pointer; transition: all 0.25s ease;
            letter-spacing: 1px; text-align: left; display: flex; flex-direction: column; gap: 4px;
        }
        .choice-btn:hover { 
            background-color: var(--neon-gold); color: #000; 
            box-shadow: 0 0 25px var(--neon-gold); border-color: var(--neon-gold);
        }
        
        /* 대사와 분리되어 아래에 깔리는 수치 메타 데이터 서식 */
        .choice-meta {
            font-family: var(--font-pixel);
            font-size: 1.15rem;
            color: var(--neon-cyan);
            letter-spacing: 2px;
            margin-top: 2px;
        }
        .choice-btn:hover .choice-meta {
            color: #0d0d0d;
            font-weight: 700;
        }

        /* 특수 상태 및 연출 효과 */
        .glitch { animation: glitch-anim 0.25s infinite; color: var(--neon-red) !important; font-weight: bold; }
        @keyframes glitch-anim {
            0% { transform: translate(0); text-shadow: 2px -2px var(--neon-cyan); }
            20% { transform: translate(-2px, 2px); text-shadow: -2px 2px var(--neon-red); }
            40% { transform: translate(-1px, -2px); }
            60% { transform: translate(2px, 1px); text-shadow: 1px -1px var(--neon-gold); }
            80% { transform: translate(-2px, -1px); }
            100% { transform: translate(0); }
        }

        .fade-out { opacity: 0 !important; }

        /* 화면이 너무 좁을 때의 반응형 예외 처리 */
        @media (max-width: 800px) {
            .split-layout { flex-direction: column; gap: 20px; }
            .left-visual-pane { position: relative; top: 0; width: 100%; }
            #stage { padding-bottom: 290px; }
            #panel { height: 280px; }
        }
    </style>
</head>
<body>

    <div id="header-fixed">
        <div id="game-title-fixed">RAPUNZEL: CYBER HEIST</div>
        <div id="hud">
            <div class="stat-box">
                <span id="label-sync" class="stat-label">SYNC</span>
                <div class="progress-bar"><div id="bar-sync" class="progress-fill"></div></div>
                <span id="val-sync" class="stat-value">0%</span>
            </div>
            <div class="stat-box">
                <span id="label-integ" class="stat-label">INTEG</span>
                <div class="progress-bar"><div id="bar-integ" class="progress-fill"></div></div>
                <span id="val-integ" class="stat-value">0%</span>
            </div>
            <div class="stat-box">
                <span id="label-public" class="stat-label">PUBLIC</span>
                <div class="progress-bar"><div id="bar-public" class="progress-fill"></div></div>
                <span id="val-public" class="stat-value">0%</span>
            </div>
        </div>
    </div>

    <div id="stage"></div>
    <div id="panel"></div>

    <script>
        let syncRate = 0;         
        let integrity = 100;      
        let publicOpinion = 50;   
        let loopFlag = false;     
        let snapshot = { s: 0, i: 0, p: 0 }; 

        const storyData = {
            "START": {
                isCover: true,
                image: "images/cover.png",
                studentInfo: "25730085 | 김서현",
                mainTitle: "[라푼젤: 사이버 하이스트]",
                variables: "[NEURAL INTERFACE INITIALIZING...]",
                choices: [{ text: "▶ [시스템 접속] : 프로토콜 가동시작", meta: "ESTABLISHING CONNECTIVITY...", action: () => { updateVars(0, 0, 0); gotoScene("S01"); } }]
            },
            "S01": {
                title: "SCENE 01: 블랙 포레스트 잠입",
                image: "images/S1.png", 
                direction: "폐쇄된 벙커 안은 뼛속까지 시린 냉기가 감돈다. 천장 배관에서 주기적으로 떨어지는 차가운 결로가 검은 눈물처럼 콘크리트 벽면을 타고 무겁게 흘러내리고, 유진 피츠허버트는 해킹 툴을 쥔 손끝의 가느다란 미동을 감추려는 듯 가죽 장갑을 거칠게 쥔다. 동면 서버 장치 깊숙한 곳에 갇힌 라푼젤은 수천 개의 미세한 금빛 나노 케이블에 온몸이 칭칭 감긴 채, 생명체라기보단 기계 네트워크의 일부가 되어버린 듯한 기괴하고도 잔혹한 성스러움을 사방에 뿜어내고 있다.",
                text: "<span class='speaker speaker-main'>[유진 피츠허버트]</span> \"빌어먹을, 고델 놈들... 기어이 사람 골수까지 빼 먹으려고 아예 메인 서버 랙에 통째로 처박아 놨군. 인터페이스 차단기가 완전히 용접되어 있어서 손쓸 틈이 없어.\"\n\n<span class='speaker speaker-rapunzel'>[라푼젤]</span> \"비밀번호를 우회하지 않고 강제로 뜯어내면, 내 의식 코어와 뇌가 그 자리에서 전부 타버릴지도 몰라요. 아저씨... 무턱대고 당겨서 실패하면, 날 평생 책임질 건가요? 아니면 그냥 불타버린 쓰레기 데이터로 폐기할 건가요?\"",
                choices: [
                    { text: "[A] \"말이 많군, 시간이 없어.\"", meta: "SYNC -10 / INTEG -30", action: () => { updateVars(-10, -30, 0); gotoScene("S02"); } },
                    { text: "[B] \"위험해. 리스크가 너무 크니 네가 내부에서 직접 방화벽을 열어.\"", meta: "SYNC +30 / INTEG MAINTAINED", action: () => { updateVars(30, 0, 0); gotoScene("S02"); } }
                ]
            },
            "S02": {
                title: "SCENE 02: 시가전 돌파",
                video: "videos/S2.mp4", 
                direction: "조잡한 마젠타색 네온광이 거세게 쏟아지는 구름 낀 하늘의 빗줄기를 투과하여, 바닥의 시커먼 기름진 웅덩이 위로 산산조각 나며 흩어진다. 고델 코퍼레이션 소속 추격 드론들의 날카롭고 신경질적인 기계음이 고막을 사정없이 긁어댈 때마다 유진 피츠허버트는 전신 엄폐물 뒤에서 어금니를 꽉 깨문다. 라푼젤의 투사된 홀로그램 의식 수치가 깜빡이며 대기권을 흐리게 흔든다.",
                text: "<span class='speaker speaker-rapunzel'>[라푼젤]</span> \"진짜 하늘에서 내리는 비는 원래 이렇게 매캐하고 씁쓸한 맛인가요? 뺨에 닿을 때마다 피부가 따끔거려요. 고델의 인공 정수 필터 밖은 전부 합성 오일과 산성 연기로 가득 찬 지옥 같네요.\"\n\n<span class='speaker speaker-main'>[유진 피츠허버트]</span> \"쓸데없는 감상은 집어치워. 여긴 하층민들이 몰려 사는 민간인 거주 구역이다. 대규모 폭발이라도 일으켰다간 내 현상 수배 평판은 쓰레기통으로 곤두박질치겠지. 하지만 이 조잡한 정밀 사격 유닛만으론 저 중장갑 드론 부대의 포위망을 뚫는 건 산술적으로 불가능해!\"",
                choices: [
                    { text: "[A] 외벽 주변의 가스 밸브관을 해킹해 광역 폭발 연쇄 유도", meta: "PUBLIC -30 / INTEG -10", action: () => { updateVars(0, -10, -30); gotoScene("S03"); } },
                    { text: "[B] 피해 폭증 위험을 감수하고 대인 방어형 정밀 타격 고수", meta: "PUBLIC +20 / INTEG -20", action: () => { updateVars(0, -20, 20); gotoScene("S03"); } }
                ]
            },
            "S03": {
                title: "SCENE 03: 지하 해커의 은신처",
                video: "videos/S3.MP4", 
                direction() {
                    return loopFlag 
                        ? "<span class='glitch'>[재구성된 기억: Memory Dive]</span> 은신처의 낡은 서버 랙들이 모니터 노이즈처럼 잔혹하고 기괴하게 붕괴되었다가 다시 거꾸로 짜 맞추어진다. 유진 피츠허버트는 뇌리를 격렬하게 스치는 극심한 데자뷔와 신경 오버클록 통증으로 비명을 삼키며 관자놀이를 강하게 짓누른다. 이 감각, 이 대화, 분명 처음이 아니다." 
                        : "해킹된 데이터 분진과 먼지가 유령처럼 허공을 떠다니는 버려진 폐공장 구석. 완전히 녹슬어버린 주황색 작업등 하나가 위태롭게 깜빡거리며 그림자를 사방으로 기괴하게 늘어뜨리고 있다. 냉각팬의 기계적인 저음만이 침묵을 채운다.";
                },
                text: "<span class='speaker speaker-rapunzel'>[라푼젤]</span> \"아저씨... 만약 내가 살과 피를 가진 인간이 아니라, 고델 코퍼레이션이 비밀리에 조작해 둔 단순한 '대용량 데이터 저장소 변종'에 불과하다면요? 그래도 아저씨는 수리비를 낭비해가며 날 고쳐줄 건가요? 아니면 쓸모가 다했을 때 깔끔하게 포맷해 버리고 다른 의뢰를 찾아 떠날 건가요? 알고 싶어요, 내 가치가 어디에 있는지.\"\n\n<span class='speaker speaker-main'>[유진 피츠허버트]</span> \"불필요한 연산으로 자원을 낭비하지 마라. 난 내 일에 충실할 뿐이고, 널 살려야 내 잔고가 채워진다. 하지만... 마음이 가리키는 방향을 나도 모르게 외면하고 있는지도 모르겠군.\"",
                choices: [
                    { text: "[A] \"감정 서브루틴은 끄고 데이터 오류나 점검해.\"", meta: "INTEG +30 / SYNC -10", action: () => { updateVars(-10, 30, 0); gotoScene("S04"); } },
                    { text: "[B] \"기계든 사람이든 상관없어. 널 끝까지 지킨다.\"", meta: "SYNC +30 / INTEG -10", action: () => { updateVars(30, -10, 0); gotoScene("S04"); } }
                ]
            },
            "S04": {
                title: "SCENE 04: 판결돔 진입 전투",

        function updateVars(s, i, p) {
            syncRate = Math.max(0, Math.min(100, syncRate + s));
            integrity = Math.max(0, Math.min(100, integrity + i));
            publicOpinion = Math.max(0, Math.min(100, publicOpinion + p));
            
            document.getElementById("bar-sync").style.width = syncRate + "%";
            document.getElementById("val-sync").innerText = syncRate + "%";
            document.getElementById("bar-integ").style.width = integrity + "%";
            document.getElementById("val-integ").innerText = integrity + "%";
            document.getElementById("bar-public").style.width = publicOpinion + "%";
            document.getElementById("val-public").innerText = publicOpinion + "%";
        }

        function gotoScene(sceneId) {
            const stage = document.getElementById("stage");
            stage.classList.add("fade-out");
            setTimeout(() => {
                renderScene(sceneId);
                stage.classList.remove("fade-out");
                window.scrollTo(0, 0); 
            }, 400);
        }

        function renderScene(sceneId) {
            const data = storyData[sceneId];
            const stage = document.getElementById("stage");
            const panel = document.getElementById("panel");
            panel.innerHTML = ""; 

            if (data.isCover) {
                // 이미지가 등록되어 있다면 이미지 태그를 생성하고, 없으면 빈 칸으로 둡니다.
                let imgHtml = data.image ? `
                    <div class="cover-image-container">
                        <img src="${data.image}" class="cover-image" alt="Cover Visual">
                    </div>` : "";

                stage.innerHTML = `
                    <div class="cover-container">
                        <div class="student-info">${data.studentInfo}</div>
                        ${imgHtml} <div class="main-title-large">${data.mainTitle}</div>
                        <div class="variable-display">${data.variables}</div>
                    </div>`;
            } else {
                if (data.image || data.video) {

    let mediaHtml = "";

    if (data.video) {
        mediaHtml = `
            <video
                class="scene-image"
                autoplay
                loop
                muted
                playsinline
                controls>
                <source src="${data.video}" type="video/mp4">
            </video>
        `;
    } else {
        mediaHtml = `
            <img src="${data.image}" class="scene-image" alt="Scene Visual">
        `;
    }

    stage.innerHTML = `
        <div class="scene-title">${data.title}</div>
        <div class="split-layout">
            <div class="left-visual-pane">
                <div class="scene-image-container">
                    ${mediaHtml}
                </div>
            </div>
            <div class="right-text-pane">
                <div class="direction">${data.direction}</div>
                <div class="scene-text">${data.text}</div>
            </div>
        </div>`;
} else {
                    stage.innerHTML = `
                        <div class="scene-title">${data.title}</div>
                        <div class="direction">${data.direction}</div>
                        <div class="scene-text">${data.text}</div>`;
                }
            }

            // 하단 조작 선택지 버튼 생성 로직 최적화 (대사와 예측 수치 클래스 분리)
            data.choices.forEach(c => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                
                // 대사 영역과 수치 안내 영역을 DOM 구조 내부에서 별개의 레이어로 파싱
                btn.innerHTML = `
                    <span class="choice-text-line">${c.text}</span>
                    <span class="choice-meta">${c.meta}</span>
                `;
                btn.onclick = c.action;
                panel.appendChild(btn);
            });
        }

        function checkFinalFate() {
            if (snapshot.s >= 60 && snapshot.i >= 80) {
                gotoScene("S07");
            }
            else if (snapshot.s >= 60 && snapshot.i < 80) {
                gotoScene("S08");
            }
            else if (snapshot.s < 60 && loopFlag === false) {
                loopFlag = true; 
                gotoScene("S03"); 
            } 
            else {
                gotoScene("S09");
            }
        }

        window.onload = () => {
            updateVars(0, 0, 0);
            renderScene("START");
        };
